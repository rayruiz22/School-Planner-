<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Planner & Grade Hub</title>

<!-- Bookmark Icon (Favicon) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0b0f19;
    --surface: #121824;
    --surface2: #1a2332;
    --border: #2a364f;
    --text: #f0f4f8;
    --text2: #94a3b8;
    --blue: #38bdf8;
    --blue-soft: rgba(56, 189, 248, 0.15);
    --green: #4ade80;
    --green-soft: rgba(74, 222, 128, 0.15);
    --orange: #fb923c;
    --orange-soft: rgba(251, 146, 60, 0.15);
    --red: #f87171;
    --red-soft: rgba(248, 113, 113, 0.15);
    --radius: 8px;
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    
    /* Grade Palette */
    --grade-aplus: #00ff66;
    --grade-a: #10b981;
    --grade-b: #84cc16;
    --grade-c: #eab308;
    --grade-d: #f97316;
    --grade-fz: #ef4444;
  }

  body.high-contrast {
    --bg: #000000;
    --surface: #0a0a0a;
    --surface2: #171717;
    --border: #ffffff;
    --text: #ffffff;
    --text2: #e5e5e5;
    --blue: #00ffff;
  }

  body.large-text {
    font-size: 18px;
  }

  body.reduced-motion * {
    animation: none !important;
    transition: none !important;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── LAYOUT ── */
  .app { display: flex; flex-direction: column; height: 100vh; }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    height: 60px;
    flex-shrink: 0;
  }
  .logo { font-weight: 700; font-size: 17px; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; color: #fff; }
  .logo span { color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.6); }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  /* Auth Bar Styles */
  .auth-container {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .user-info {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text);
  }
  .user-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--blue);
  }

  /* ── TAB NAV ── */
  .tab-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 24px;
    overflow-x: auto;
    flex-shrink: 0;
  }
  .tab {
    padding: 10px 14px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text2);
    border: none;
    background: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    white-space: nowrap;
    transition: all .15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: #38bdf8; border-bottom-color: #38bdf8; text-shadow: 0 0 8px rgba(56, 189, 248, 0.4); }

  /* ── TOOLBAR ── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 24px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .toolbar-left { display: flex; align-items: center; gap: 8px; }
  .toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .month-nav { display: flex; align-items: center; gap: 8px; }
  .month-title { font-size: 18px; font-weight: 700; min-width: 220px; text-align: center; color: #fff; }

  /* ── BUTTONS & INPUTS ── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px;
    border-radius: var(--radius);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    transition: all .15s;
    white-space: nowrap;
  }
  .btn:hover { background: #222f44; border-color: #3b4d6c; }
  .btn-icon {
    padding: 7px 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    color: var(--text);
    transition: all .15s;
  }
  .btn-icon:hover { background: #222f44; border-color: #3b4d6c; }
  .btn-primary {
    background: #0284c7;
    color: #fff;
    border-color: #38bdf8;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
  }
  .btn-primary:hover { background: #0369a1; box-shadow: 0 0 18px rgba(56, 189, 248, 0.5); }
  .btn-today {
    background: var(--blue-soft);
    color: var(--blue);
    border-color: rgba(56, 189, 248, 0.4);
    font-weight: 600;
  }
  .btn-today:hover { background: rgba(56, 189, 248, 0.25); }

  /* CALENDAR VIEW MODE SELECTOR */
  .view-mode-selector {
    display: flex;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2px;
    gap: 2px;
  }
  .view-mode-btn {
    border: none;
    background: none;
    color: var(--text2);
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 700;
    border-radius: 6px;
    cursor: pointer;
    transition: all .15s;
  }
  .view-mode-btn.active {
    background: #0284c7;
    color: #fff;
  }

  /* STATUS SHORTCUT BUTTON */
  .status-shortcut-btn {
    border: 1px solid var(--border);
    background: var(--surface2);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .status-shortcut-btn:hover { filter: brightness(1.2); }
  .status-shortcut-btn:active { transform: scale(0.96); }

  select.filter-select {
    padding: 6px 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    font-size: 13.5px;
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  select.filter-select:focus { border-color: var(--blue); }

  /* ── MAIN CONTENT ── */
  .main { flex: 1; overflow-y: auto; padding: 0; }

  /* ── CALENDAR ── */
  .calendar-wrap { padding: 20px 24px; }
  .cal-grid {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .cal-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }
  .cal-header.single-col { grid-template-columns: 1fr; }
  .cal-day-name {
    text-align: center;
    padding: 10px 4px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text2);
  }
  .cal-body {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }
  .cal-body.single-col { grid-template-columns: 1fr; }
  .cal-cell {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    min-height: 115px;
    padding: 6px;
    cursor: pointer;
    transition: background .15s;
    position: relative;
    background: var(--bg);
  }
  .cal-cell.day-view-cell {
    min-height: 350px;
    padding: 16px;
  }
  .cal-cell:hover { background: #131b2a; }
  .cal-cell:nth-child(7n) { border-right: none; }
  .cal-cell.other-month .cell-date { color: #475569; }
  .cal-cell.other-month { background: #080c14; }
  .cal-cell.today { background: rgba(56, 189, 248, 0.08); }
  .cal-cell.today .cell-date {
    background: #0284c7;
    color: #fff;
    border-radius: 50%;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
  }
  .cell-date { font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--text); }
  .cell-events { display: flex; flex-direction: column; gap: 4px; }
  .cell-event {
    font-size: 11.5px;
    padding: 3px 6px;
    border-radius: 5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: transform .1s, filter .1s;
    display: flex;
    align-items: center;
    gap: 4px;
    border-left: 3px solid transparent;
  }
  .cell-event:hover { transform: translateY(-1px); filter: brightness(1.25); }
  .cell-event.completed { opacity: .4; text-decoration: line-through; box-shadow: none !important; }
  .more-badge {
    font-size: 11px;
    color: var(--blue);
    padding: 2px 0;
    cursor: pointer;
    font-weight: 700;
  }
  .more-badge:hover { text-decoration: underline; }

  /* ── BADGES & PILLS ── */
  .type-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .class-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
  }

  /* ── LETTER GRADES ── */
  .letter-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 800;
    text-shadow: 0 0 6px rgba(0,0,0,0.5);
  }
  .grade-A-plus { background: #003816; color: var(--grade-aplus); border: 1px solid var(--grade-aplus); box-shadow: 0 0 8px rgba(0,255,102,0.4); }
  .grade-A      { background: #064e3b; color: var(--grade-a); border: 1px solid var(--grade-a); }
  .grade-B      { background: #1a2e05; color: var(--grade-b); border: 1px solid var(--grade-b); }
  .grade-C      { background: #422006; color: var(--grade-c); border: 1px solid var(--grade-c); }
  .grade-D      { background: #431407; color: var(--grade-d); border: 1px solid var(--grade-d); }
  .grade-FZ     { background: #450a0a; color: var(--grade-fz); border: 1px solid var(--grade-fz); box-shadow: 0 0 6px rgba(239,68,68,0.3); }

  .status-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
  }
  .status-not-started { background: var(--surface2); color: var(--text2); border-color: var(--border); }
  .status-in-progress { background: var(--orange-soft); color: #ffad66; border-color: rgba(251, 146, 60, 0.4); text-shadow: 0 0 6px rgba(251, 146, 60, 0.4); }
  .status-completed   { background: var(--green-soft); color: #6ee7b7; border-color: rgba(74, 222, 128, 0.4); text-shadow: 0 0 6px rgba(74, 222, 128, 0.4); }

  .days-badge {
    font-size: 12px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
  }
  .days-overdue { background: var(--red-soft); color: #fca5a5; border: 1px solid rgba(248, 113, 113, 0.3); text-shadow: 0 0 6px rgba(248, 113, 113, 0.4); }
  .days-today   { background: var(--orange-soft); color: #ffad66; border: 1px solid rgba(251, 146, 60, 0.3); text-shadow: 0 0 6px rgba(251, 146, 60, 0.4); }
  .days-soon    { background: rgba(250, 204, 21, 0.15); color: #fde047; border: 1px solid rgba(250, 204, 21, 0.3); text-shadow: 0 0 6px rgba(250, 204, 21, 0.4); }
  .days-ok      { background: var(--surface2); color: var(--text2); }

  /* ── TABLES & LISTS ── */
  .list-view { padding: 20px 24px; }
  .list-table {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
    border-collapse: separate;
    border-spacing: 0;
  }
  .list-table th {
    text-align: left;
    padding: 12px 14px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text2);
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }
  .list-table td {
    padding: 12px 14px;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .list-table tr:last-child td { border-bottom: none; }
  .list-table tr:hover td { background: #182232; }
  .list-table tr.row-completed td { opacity: .45; }
  .list-table tr.row-overdue td .due-date { color: #fca5a5; font-weight: 700; }

  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--text2);
  }
  .empty-state .es-icon { font-size: 36px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }

  /* ── CONVERTER CARD ── */
  .calc-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    max-width: 500px;
    margin: 0 auto;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .calc-badge {
    display: inline-block;
    font-size: 2.2rem;
    font-weight: 800;
    padding: 12px 24px;
    border-radius: 10px;
    background: var(--surface2);
    margin-top: 8px;
  }

  /* ── SETTINGS CARD ── */
  .settings-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    max-width: 650px;
    margin: 0 auto;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .settings-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
  }
  .settings-section:last-child { border-bottom: none; }
  .settings-section h3 { font-size: 15px; font-weight: 700; color: #fff; }
  .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .setting-info { display: flex; flex-direction: column; gap: 2px; }
  .setting-title { font-weight: 600; font-size: 14px; }
  .setting-desc { font-size: 12.5px; color: var(--text2); }

  /* TOGGLES */
  .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background-color: var(--surface2); transition: .2s; border-radius: 24px; border: 1px solid var(--border); }
  .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: var(--text2); transition: .2s; border-radius: 50%; }
  input:checked + .slider { background-color: #0284c7; }
  input:checked + .slider:before { transform: translateX(20px); background-color: #fff; }

  /* ── MODALS ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    width: 100%;
    max-width: 540px;
    max-height: 90vh;
    overflow-y: auto;
    transform: translateY(12px);
    transition: transform .2s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
  }
  .modal-header h2 { font-size: 17px; font-weight: 700; color: #fff; }
  .modal-close {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--text2);
    padding: 4px 8px;
    border-radius: 6px;
  }
  .modal-close:hover { background: var(--surface2); color: #fff; }
  .modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .modal-footer {
    display: flex; align-items: center; justify-content: flex-end; gap: 10px;
    padding: 16px 24px;
    border-top: 1px solid var(--border);
  }

  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { font-size: 13px; font-weight: 600; color: var(--text); }
  .form-input {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color .15s;
    font-family: inherit;
    width: 100%;
  }
  .form-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
  textarea.form-input { resize: vertical; min-height: 70px; }

  /* DAY MODAL CARDS */
  .day-event-list { display: flex; flex-direction: column; gap: 8px; }
  .day-event-card {
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s;
  }
  .day-event-card:hover { border-color: #3b4d6c; box-shadow: var(--shadow); }
  .day-event-card.completed { opacity: .5; }
  .day-event-title { font-weight: 600; font-size: 14px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
  .day-event-meta { font-size: 12.5px; color: var(--text2); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #3b4d6c; }

  @media (max-width: 700px) {
    header { padding: 0 14px; }
    .toolbar { padding: 10px 14px; }
    .tab-bar { padding: 0 14px; }
    .calendar-wrap, .list-view { padding: 14px; }
    .cal-cell { min-height: 75px; }
    .form-row { grid-template-columns: 1fr; }
    .toolbar-right { width: 100%; }
    .month-title { font-size: 15px; min-width: 140px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header>
    <div class="logo">📖 <span>School</span> Planner</div>
    <div class="header-right">
      <div id="authContainer" class="auth-container">
        <button id="loginBtn" class="btn">Sign In with Google</button>
        <div id="userInfo" class="user-info" style="display: none;">
          <img id="userAvatar" class="user-avatar" src="" alt="User Avatar" />
          <span id="userName"></span>
          <button id="logoutBtn" class="btn" style="padding: 4px 8px; font-size: 12px;">Sign Out</button>
        </div>
      </div>
      <button class="btn btn-primary" onclick="openAddModal(null)">+ Add Item</button>
    </div>
  </header>

  <!-- TAB BAR -->
  <nav class="tab-bar">
    <button class="tab active" data-view="calendar" onclick="switchView('calendar', this)">📅 Calendar</button>
    <button class="tab" data-view="upcoming" onclick="switchView('upcoming', this)">🔜 Upcoming</button>
    <button class="tab" data-view="today" onclick="switchView('today', this)">⭐ Today</button>
    <button class="tab" data-view="overdue" onclick="switchView('overdue', this)">⚠️ Overdue</button>
    <button class="tab" data-view="week" onclick="switchView('week', this)">📆 This Week</button>
    <button class="tab" data-view="byclass" onclick="switchView('byclass', this)">📖 By Class</button>
    <button class="tab" data-view="converter" onclick="switchView('converter', this)">💯 Grade Converter</button>
    <button class="tab" data-view="completed" onclick="switchView('completed', this)">✅ Completed</button>
    <button class="tab" data-view="settings" onclick="switchView('settings', this)">⚙️ Settings & Accessibility</button>
  </nav>

  <!-- TOOLBAR -->
  <div class="toolbar" id="toolbar"></div>

  <!-- MAIN -->
  <main class="main" id="main"></main>

</div>

<!-- ADD / EDIT MODAL -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Add Item</h2>
      <button class="modal-close" onclick="closeModal('addModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Title *</label>
        <input class="form-input" id="f-title" placeholder="e.g. Chapter 5 Reading" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Date (optional)</label>
          <input class="form-input" id="f-date" type="date" onchange="handleDateChange()" />
        </div>
        <div class="form-group">
          <label>Due Time (optional)</label>
          <input class="form-input" id="f-time" type="time" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">

            <option>Homework</option>
            <option>Quiz</option>
            <option>Test</option>
            <option>Progress Checks</option>
            <option>Project</option>
            <option>Event</option>
            <option>Exam</option>

            <option>In Progress</option>
            <option>Completed</option>
          </select>

        <div class="form-group">
          <label>Repeat / Recurring</label>
          <select class="form-input" id="f-recurring">
            <option value="none">None</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="biweekly">Biweekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Scoring System</label>
          <select class="form-input" id="f-scoreType" onchange="handleScoreTypeChange()">
            <option value="none">None</option>
            <option value="base4">Base 4 / GPA (0 - 4.0)</option>
            <option value="base100">Base 100 (0 - 100%)</option>
          </select>
        </div>
        <div class="form-group" id="scoreValueGroup" style="display: none;">
          <label id="scoreValueLabel">Score</label>
          <input class="form-input" id="f-scoreValue" type="number" step="any" placeholder="Enter score" />
        </div>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea class="form-input" id="f-notes" placeholder="Any extra details..."></textarea>
      </div>
      <div class="form-group">
        <label>Link / Attachment (optional)</label>
        <input class="form-input" id="f-link" type="url" placeholder="https://..." />
      </div>
    </div>
    <div class="modal-footer">
      <button id="deleteBtn" class="btn" style="margin-right:auto;color:var(--red);border-color:rgba(248,113,113,0.3);display:none" onclick="deleteItem()">Delete</button>
      <button class="btn" onclick="closeModal('addModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveItem()">Save</button>
    </div>
  </div>
</div>

<!-- DAY MODAL -->
<div class="modal-overlay" id="dayModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="dayModalTitle">Events</h2>
      <button class="modal-close" onclick="closeModal('dayModal')">✕</button>
    </div>
    <div class="modal-body" id="dayModalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="dayModalAddBtn">+ Add to This Day</button>
    </div>
  </div>
</div>

<script>
// CLASS DEFINITIONS
const CLASS_DEFINITIONS = [
  { name: 'General School / Administrative', icon: '🏫', bg: 'rgba(236, 72, 153, 0.2)', border: '#ec4899', text: '#f472b6', shadow: 'rgba(236, 72, 153, 0.5)' },
  { name: 'AP Psychology', icon: '🧠', bg: 'rgba(168, 85, 247, 0.2)', border: '#a855f7', text: '#c084fc', shadow: 'rgba(168, 85, 247, 0.5)' },
  { name: 'AP Human Geography', icon: '🌍', bg: 'rgba(20, 184, 166, 0.2)', border: '#14b8a6', text: '#2dd4bf', shadow: 'rgba(20, 184, 166, 0.5)' },
  { name: 'AP Calculus AB', icon: '📐', bg: 'rgba(56, 189, 248, 0.2)', border: '#38bdf8', text: '#38bdf8', shadow: 'rgba(56, 189, 248, 0.5)' },
  { name: 'AP Biology', icon: '🧬', bg: 'rgba(74, 222, 128, 0.2)', border: '#4ade80', text: '#4ade80', shadow: 'rgba(74, 222, 128, 0.5)' },
  { name: 'Dual Enrollment College Algebra', icon: '🔢', bg: 'rgba(251, 146, 60, 0.2)', border: '#fb923c', text: '#fb923c', shadow: 'rgba(251, 146, 60, 0.5)', term: 'fall' },
  { name: 'Dual Enrollment Precalculus Algebra', icon: '📈', bg: 'rgba(249, 115, 22, 0.2)', border: '#f97316', text: '#ff8c38', shadow: 'rgba(249, 115, 22, 0.5)', term: 'spring' },
  { name: 'English Honors', icon: '📚', bg: 'rgba(244, 63, 94, 0.2)', border: '#f43f5e', text: '#fb7185', shadow: 'rgba(244, 63, 94, 0.5)' },
  { name: 'AP Computer Science Principles (AP CSP)', icon: '💻', bg: 'rgba(6, 182, 212, 0.2)', border: '#06b6d4', text: '#22d3ee', shadow: 'rgba(6, 182, 212, 0.5)' },
  { name: 'Personal Finance & Money Management', icon: '💵', bg: 'rgba(132, 204, 22, 0.2)', border: '#84cc16', text: '#a3e635', shadow: 'rgba(132, 204, 22, 0.5)', term: 'fall' },
  { name: 'Philosophy Honors', icon: '🏛️', bg: 'rgba(217, 70, 239, 0.2)', border: '#d946ef', text: '#e879f9', shadow: 'rgba(217, 70, 239, 0.5)', term: 'spring' }
];

const DEFAULT_CLASS = { icon: '📖', bg: 'rgba(148, 163, 184, 0.2)', border: '#94a3b8', text: '#cbd5e1', shadow: 'rgba(148, 163, 184, 0.4)' };

function getClassInfo(className) {
  return CLASS_DEFINITIONS.find(c => c.name === className) || DEFAULT_CLASS;
}

// SETTINGS & ACCESSIBILITY
const SETTINGS_KEY = 'school_planner_settings_v1';
let userSettings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || JSON.stringify({
  highContrast: false,
  largeText: false,
  reducedMotion: false,
  autoZeroOverdue: true
}));

function applySettings() {
  document.body.classList.toggle('high-contrast', !!userSettings.highContrast);
  document.body.classList.toggle('large-text', !!userSettings.largeText);
  document.body.classList.toggle('reduced-motion', !!userSettings.reducedMotion);
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(userSettings));
}

function updateSetting(key, val) {
  userSettings[key] = val;
  applySettings();
  save();
  if (key === 'autoZeroOverdue') render();
}

// GRADE CONVERSION & OVERDUE LOGIC
function getLetterGrade(score, scoreType) {
  if (isNaN(score) || score === null || score === undefined || score === '') return "-";

  if (scoreType === "base4" || scoreType === "gpa") {
    if (score >= 4.0) return "A+";
    if (score === 0) return "Z";
    if (score >= 0.01 && score <= 0.49) return "F";
    if (score >= 0.50 && score <= 1.49) return "D";
    if (score >= 1.50 && score <= 2.49) return "C";
    if (score >= 2.50 && score <= 3.49) return "B";
    if (score >= 3.50 && score <= 4.00) return "A";
    return "Invalid";
  } else if (scoreType === "base100" || scoreType === "percent") {
    if (score >= 100) return "A+";
    if (score === 0) return "Z";
    if (score > 0 && score <= 59) return "F";
    if (score >= 60 && score <= 69) return "D";
    if (score >= 70 && score <= 79) return "C";
    if (score >= 80 && score <= 89) return "B";
    if (score >= 90 && score <= 100) return "A";
    return "Invalid";
  }
  return "-";
}

function getGradeClass(letter) {
  switch (letter) {
    case 'A+': return 'grade-A-plus';
    case 'A': return 'grade-A';
    case 'B': return 'grade-B';
    case 'C': return 'grade-C';
    case 'D': return 'grade-D';
    case 'F':
    case 'Z': return 'grade-FZ';
    default: return '';
  }
}

function computeEffectiveScoreInfo(item) {
  const du = daysUntil(item.date);
  const isOverdue = du !== null && du < 0 && item.status !== 'Completed';

  if (isOverdue && userSettings.autoZeroOverdue) {
    return { letter: 'Z', scoreType: item.scoreType || 'base100', isAutoZero: true };
  }

  if (!item.scoreType || item.scoreType === 'none' || item.scoreValue === undefined || item.scoreValue === null || item.scoreValue === '') {
    return null;
  }

  const val = parseFloat(item.scoreValue);
  const letter = getLetterGrade(val, item.scoreType);
  return { letter, scoreType: item.scoreType, isAutoZero: false };
}

function handleScoreTypeChange() {
  const scoreType = document.getElementById('f-scoreType').value;
  const group = document.getElementById('scoreValueGroup');
  const label = document.getElementById('scoreValueLabel');
  const input = document.getElementById('f-scoreValue');

  if (scoreType === 'base4') {
    group.style.display = 'flex';
    label.textContent = 'Score (0 - 4.0+)';
    input.max = '5';
    input.min = '0';
    input.placeholder = 'e.g. 3.5 or 4.2 for Extra Credit';
  } else if (scoreType === 'base100') {
    group.style.display = 'flex';
    label.textContent = 'Score (%)';
    input.max = '150';
    input.min = '0';
    input.placeholder = 'e.g. 95 or 105 for Extra Credit';
  } else {
    group.style.display = 'none';
    input.value = '';
  }
}

function getScoreBadgeHtml(item) {
  const info = computeEffectiveScoreInfo(item);
  if (!info || info.letter === '-' || info.letter === 'Invalid') return '';

  const cls = getGradeClass(info.letter);
  const titleAttr = info.isAutoZero ? ' title="Automatically set to 0 (Z) because item is overdue"' : '';
  return `<span class="letter-badge ${cls}"${titleAttr}>${info.letter}</span>`;
}

function getAutoClassForDate(dateStr) {
  if (!dateStr) return null;
  const month = parseLocalDate(dateStr).getMonth() + 1;
  const isFall = (month >= 8 && month <= 12);
  return isFall ? 'Dual Enrollment College Algebra' : 'Dual Enrollment Precalculus Algebra';
}

function handleDateChange() {
  const dateVal = document.getElementById('f-date').value;
  if (!dateVal) return;

  const currentClass = document.getElementById('f-class').value;
  if (!currentClass || currentClass.includes('Dual Enrollment')) {
    const autoClass = getAutoClassForDate(dateVal);
    if (autoClass) document.getElementById('f-class').value = autoClass;
  }

  if (currentClass === 'Personal Finance & Money Management' || currentClass === 'Philosophy Honors') {
    const month = parseLocalDate(dateVal).getMonth() + 1;
    const isFall = (month >= 8 && month <= 12);
    document.getElementById('f-class').value = isFall ? 'Personal Finance & Money Management' : 'Philosophy Honors';
  }
}

// STORAGE & STATE
const STORAGE_KEY = 'school_planner_v2';
let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let currentView = 'calendar';
let calendarViewMode = 'month';
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let calDay = new Date().getDate();
let editingId = null;
let filterClass = '', filterType = '', filterStatus = '';
window.plannerBridge = {
  getItems: () => items,
  getSettings: () => userSettings,

  getState: () => ({
    items,
    settings: userSettings
  }),

  setState: (newItems, newSettings) => {
    items = Array.isArray(newItems) ? newItems : [];
    userSettings = {
      highContrast: false,
      largeText: false,
      reducedMotion: false,
      autoZeroOverdue: true,
      ...(newSettings || {})
    };

    applySettings();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    render();
  },

  render: () => render()
};
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));

  if (window.firebasePlannerSync) {
    window.firebasePlannerSync.save();
  }
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function today() { return fmtDate(new Date()); }

function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function parseLocalDate(dateStr) {
  if (!dateStr) return null;
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function addDays(date, days) {
  const result = new Date(date);
  result.setDate(result.getDate() + days);
  return result;
}

function addMonths(date, months) {
  const result = new Date(date);
  result.setMonth(result.getMonth() + months);
  return result;
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const t = new Date(today()); t.setHours(0,0,0,0);
  const d = parseLocalDate(dateStr); d.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}

function displayDate(dateStr) {
  if (!dateStr) return 'No Due Date';
  const d = parseLocalDate(dateStr);
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

function statusClass(s) {
  const map = {'Not Started':'status-not-started','In Progress':'status-in-progress','Completed':'status-completed'};
  return map[s] || 'status-not-started';
}

function daysLabel(n) {
  if (n === null) return `<span class="days-badge days-ok">No due date</span>`;
  if (n < 0) return `<span class="days-badge days-overdue">${Math.abs(n)}d overdue</span>`;
  if (n === 0) return `<span class="days-badge days-today">Due today</span>`;
  if (n <= 3) return `<span class="days-badge days-soon">${n}d left</span>`;
  return `<span class="days-badge days-ok">${n}d left</span>`;
}

function cycleStatus(id, e) {
  if (e) e.stopPropagation();
  const item = items.find(i => i.id === id);
  if (!item) return;

  const statusOrder = ['Not Started', 'In Progress', 'Completed'];
  const nextIdx = (statusOrder.indexOf(item.status) + 1) % statusOrder.length;
  item.status = statusOrder[nextIdx];

  save();
  render();
}

function getStatusShortcutBtnHtml(item) {
  let icon = '⭕';
  let label = 'Not Started';
  if (item.status === 'In Progress') { icon = '⏳'; label = 'In Progress'; }
  else if (item.status === 'Completed') { icon = '✅'; label = 'Completed'; }

  return `<button class="status-shortcut-btn ${statusClass(item.status)}" onclick='cycleStatus("${item.id}", event)' title="Click to cycle status">${icon} ${label}</button>`;
}

function getClassPillHtml(className) {
  if (!className) return '<span style="color:var(--text2)">—</span>';
  const info = getClassInfo(className);
  return `<span class="class-pill" style="background:${info.bg};color:${info.text};border:1px solid ${info.border};box-shadow: 0 0 8px ${info.shadow}">${info.icon} ${esc(className)}</span>`;
}

function applyFilters(list) {
  return list.filter(i => {
    if (filterClass && i.cls !== filterClass) return false;
    if (filterType && i.type !== filterType) return false;
    if (filterStatus && i.status !== filterStatus) return false;
    return true;
  });
}

// RENDER ROUTER
function render() {
  applySettings();
  populateClassOptions();
  renderToolbar();
  const main = document.getElementById('main');
  if (currentView === 'calendar') main.innerHTML = renderCalendar();
  else if (currentView === 'upcoming') main.innerHTML = renderList(getUpcoming(), 'Upcoming Deadlines');
  else if (currentView === 'today') main.innerHTML = renderList(getToday(), "Today's Items");
  else if (currentView === 'overdue') main.innerHTML = renderList(getOverdue(), 'Overdue Items');
  else if (currentView === 'week') main.innerHTML = renderList(getWeek(), 'This Week');
  else if (currentView === 'byclass') main.innerHTML = renderByClass();
  else if (currentView === 'converter') main.innerHTML = renderConverter();
  else if (currentView === 'completed') main.innerHTML = renderList(getCompleted(), 'Completed');
  else if (currentView === 'settings') main.innerHTML = renderSettings();
}

function switchView(v, el) {
  currentView = v;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  filterClass = filterType = filterStatus = '';
  render();
}

// TOOLBAR & NAVIGATION
function populateClassOptions() {
  const sel = document.getElementById('f-class');
  if (!sel) return;
  sel.innerHTML = CLASS_DEFINITIONS.map(c => `<option value="${esc(c.name)}">${c.icon} ${esc(c.name)}</option>`).join('');
}

function renderToolbar() {
  const bar = document.getElementById('toolbar');
  const isCalendar = currentView === 'calendar';

  const modeSelector = isCalendar ? `
    <div class="view-mode-selector">
      <button class="view-mode-btn ${calendarViewMode==='month'?'active':''}" onclick="setCalViewMode('month')">Month</button>
      <button class="view-mode-btn ${calendarViewMode==='week'?'active':''}" onclick="setCalViewMode('week')">Week</button>
      <button class="view-mode-btn ${calendarViewMode==='day'?'active':''}" onclick="setCalViewMode('day')">Day</button>
    </div>` : '';

  const monthNav = isCalendar ? `
    <div class="month-nav">
      <button class="btn-icon" onclick="changeCalNav(-1)">‹</button>
      <div class="month-title" id="monthTitle">${getCalTitle()}</div>
      <button class="btn-icon" onclick="changeCalNav(1)">›</button>
      <button class="btn btn-today" onclick="goToday()">Today</button>
      ${modeSelector}
    </div>` : '';

  const classOpts = CLASS_DEFINITIONS.map(c => `<option value="${esc(c.name)}">${c.icon} ${esc(c.name)}</option>`).join('');

  if (currentView === 'converter') {
    bar.innerHTML = `<div class="toolbar-left"><span style="font-weight:700;color:#fff;">💯 Standalone Grade Converter</span></div>`;
    return;
  }

  if (currentView === 'settings') {
    bar.innerHTML = `<div class="toolbar-left"><span style="font-weight:700;color:#fff;">⚙️ Settings & Accessibility Preferences</span></div>`;
    return;
  }

  bar.innerHTML = `
    <div class="toolbar-left">${monthNav}</div>
    <div class="toolbar-right">
      <select class="filter-select" id="filter-class" onchange="setFilter('class', this.value)">
        <option value="">All Categories & Classes</option>${classOpts}
      </select>
      <select class="filter-select" id="filter-type" onchange="setFilter('type', this.value)">
        <option value="">All Types</option>
        <option>Class Work</option><option>Homework</option><option>Quiz</option>
        <option>Test</option><option>Progress Checks</option><option>Project</option>
        <option>Event</option><option>Exam</option><option>Vocabulary</option>
        <option>Reading Guide</option><option>Other</option>
      </select>
      <select class="filter-select" id="filter-status" onchange="setFilter('status', this.value)">
        <option value="">All Statuses</option>
        <option>Not Started</option><option>In Progress</option><option>Completed</option>
      </select>
    </div>`;

  if (filterClass) bar.querySelector('#filter-class').value = filterClass;
  if (filterType) bar.querySelector('#filter-type').value = filterType;
  if (filterStatus) bar.querySelector('#filter-status').value = filterStatus;
}

function setFilter(key, val) {
  if (key === 'class') filterClass = val;
  else if (key === 'type') filterType = val;
  else if (key === 'status') filterStatus = val;
  render();
}

function setCalViewMode(m) {
  calendarViewMode = m;
  render();
}

function getCalTitle() {
  const d = new Date(calYear, calMonth, calDay);
  if (calendarViewMode === 'month') {
    return d.toLocaleDateString('en-US', {month:'long', year:'numeric'});
  } else if (calendarViewMode === 'week') {
    const sun = new Date(d); sun.setDate(d.getDate() - d.getDay());
    const sat = new Date(sun); sat.setDate(sun.getDate() + 6);
    return `${sun.toLocaleDateString('en-US', {month:'short', day:'numeric'})} - ${sat.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})}`;
  } else {
    return d.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric'});
  }
}

function changeCalNav(dir) {
  if (calendarViewMode === 'month') {
    calMonth += dir;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    if (calMonth > 11) { calMonth = 0; calYear++; }
  } else if (calendarViewMode === 'week') {
    const cur = new Date(calYear, calMonth, calDay);
    cur.setDate(cur.getDate() + (dir * 7));
    calYear = cur.getFullYear();
    calMonth = cur.getMonth();
    calDay = cur.getDate();
  } else {
    const cur = new Date(calYear, calMonth, calDay);
    cur.setDate(cur.getDate() + dir);
    calYear = cur.getFullYear();
    calMonth = cur.getMonth();
    calDay = cur.getDate();
  }
  render();
}

function goToday() {
  const n = new Date();
  calYear = n.getFullYear();
  calMonth = n.getMonth();
  calDay = n.getDate();
  render();
}

// CALENDAR VIEWS
function renderCalendar() {
  if (calendarViewMode === 'week') return renderWeekCalendar();
  if (calendarViewMode === 'day') return renderDayCalendar();

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();
  const todayStr = today();
  const filtered = applyFilters(items);

  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let html = `<div class="calendar-wrap"><div class="cal-grid">`;
  html += `<div class="cal-header">${days.map(d=>`<div class="cal-day-name">${d}</div>`).join('')}</div>`;
  html += `<div class="cal-body">`;

  for (let i = firstDay - 1; i >= 0; i--) {
    const d = daysInPrev - i;
    const dStr = fmtDate(new Date(calMonth === 0 ? calYear-1 : calYear, calMonth === 0 ? 11 : calMonth-1, d));
    html += cellHtml(d, dStr, todayStr, true, filtered);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dStr = fmtDate(new Date(calYear, calMonth, d));
    html += cellHtml(d, dStr, todayStr, false, filtered);
  }

  const total = firstDay + daysInMonth;
  const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let d = 1; d <= remaining; d++) {
    const dStr = fmtDate(new Date(calMonth === 11 ? calYear+1 : calYear, calMonth === 11 ? 0 : calMonth+1, d));
    html += cellHtml(d, dStr, todayStr, true, filtered);
  }

  html += `</div></div></div>`;
  return html;
}

function renderWeekCalendar() {
  const cur = new Date(calYear, calMonth, calDay);
  const sun = new Date(cur); sun.setDate(cur.getDate() - cur.getDay());
  const todayStr = today();
  const filtered = applyFilters(items);
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  let html = `<div class="calendar-wrap"><div class="cal-grid">`;
  html += `<div class="cal-header">${days.map((d, idx) => {
    const cellD = new Date(sun); cellD.setDate(sun.getDate() + idx);
    return `<div class="cal-day-name">${d}${cellD.getDate()}</div>`;
  }).join('')}</div>`;
  
  html += `<div class="cal-body">`;
  for (let i = 0; i < 7; i++) {
    const cellD = new Date(sun); cellD.setDate(sun.getDate() + i);
    const dStr = fmtDate(cellD);
    html += cellHtml(cellD.getDate(), dStr, todayStr, false, filtered, 10);
  }
  html += `</div></div></div>`;
  return html;
}

function renderDayCalendar() {
  const cur = new Date(calYear, calMonth, calDay);
  const dStr = fmtDate(cur);
  const todayStr = today();
  const filtered = applyFilters(items);
  const dayName = cur.toLocaleDateString('en-US', {weekday:'long'});

  let html = `<div class="calendar-wrap"><div class="cal-grid">`;
  html += `<div class="cal-header single-col"><div class="cal-day-name">${dayName} (${dStr})</div></div>`;
  html += `<div class="cal-body single-col">`;
  html += cellHtml(cur.getDate(), dStr, todayStr, false, filtered, 50, true);
  html += `</div></div></div>`;
  return html;
}

function cellHtml(day, dateStr, todayStr, otherMonth, filtered, maxShow = 3, isDayView = false) {
  const isToday = dateStr === todayStr;
  const dayItems = filtered.filter(i => i.date === dateStr);
  const shown = dayItems.slice(0, maxShow);
  const extra = dayItems.length - maxShow;

  let cls = 'cal-cell';
  if (otherMonth) cls += ' other-month';
  if (isToday) cls += ' today';
  if (isDayView) cls += ' day-view-cell';

  let evHtml = shown.map(item => {
    const done = item.status === 'Completed';
    const recSymbol = item.recurring && item.recurring !== 'none' ? ' 🔄' : '';
    const classInfo = getClassInfo(item.cls);
    const scoreBadge = getScoreBadgeHtml(item);

    return `<div class="cell-event ${done?' completed':''}" 
      style="background:${classInfo.bg};color:${classInfo.text};border-left-color:${classInfo.border};box-shadow:0 0 6px ${classInfo.shadow}"
      title="${esc(item.title)} (${esc(item.cls || 'No Category')})" onclick='openDetail("${item.id}",event)'>
      <span>${classInfo.icon}</span> 
      <span style="font-weight:600;overflow:hidden;text-overflow:ellipsis">${esc(item.title)}</span>
      ${scoreBadge}
      ${recSymbol}
    </div>`;
  }).join('');

  if (extra > 0) evHtml += `<div class="more-badge" onclick='openDayModal("${dateStr}",event)'>+${extra} more</div>`;

  return `<div class="${cls}" onclick='openDayModal("${dateStr}",event)'>
    <div class="cell-date">${day}</div>
    <div class="cell-events">${evHtml}</div>
  </div>`;
}

// LIST FILTERS & SELECTORS
function getUpcoming() {
  const t = today();
  const allFiltered = applyFilters(items).filter(i => (!i.date || i.date >= t) && i.status !== 'Completed');
  
  allFiltered.sort((a,b) => {
    if (!a.date && !b.date) return 0;
    if (!a.date) return 1;
    if (!b.date) return -1;
    return a.date.localeCompare(b.date);
  });

  const seenGroups = new Set();
  const result = [];

  for (const item of allFiltered) {
    if (item.recurringGroupId) {
      if (!seenGroups.has(item.recurringGroupId)) {
        seenGroups.add(item.recurringGroupId);
        result.push(item);
      }
    } else {
      result.push(item);
    }
  }

  return result;
}

function getToday() {
  const t = today();
  return applyFilters(items).filter(i => i.date === t).sort((a,b) => (a.time||'').localeCompare(b.time||''));
}

function getOverdue() {
  const t = today();
  return applyFilters(items)
    .filter(i => i.date && i.date < t && i.status !== 'Completed')
    .sort((a,b) => b.date.localeCompare(a.date));
}

function getWeek() {
  const now = new Date(); now.setHours(0,0,0,0);
  const dow = now.getDay();
  const sun = new Date(now); sun.setDate(now.getDate() - dow);
  const sat = new Date(sun); sat.setDate(sun.getDate() + 6);
  const s = fmtDate(sun), e = fmtDate(sat);
  return applyFilters(items).filter(i => i.date && i.date >= s && i.date <= e).sort((a,b)=>a.date.localeCompare(b.date));
}

function getCompleted() {
  return applyFilters(items).filter(i => i.status === 'Completed').sort((a,b) => {
    if (!a.date && !b.date) return 0;
    if (!a.date) return 1;
    if (!b.date) return -1;
    return b.date.localeCompare(a.date);
  });
}

// LIST RENDERING
function renderList(list, title) {
  if (list.length === 0) {
    return `<div class="list-view"><div class="empty-state"><div class="es-icon">🎉</div><p>No items found.</p></div></div>`;
  }
  const rows = list.map(item => {
    const du = daysUntil(item.date);
    const isOverdue = du !== null && du < 0 && item.status !== 'Completed';
    const done = item.status === 'Completed';
    const recLabel = item.recurring && item.recurring !== 'none' ? ` <span style="font-size:12px;color:var(--text2)">🔄 ${item.recurring}</span>` : '';
    const scoreBadge = getScoreBadgeHtml(item);
    
    return `<tr class="${done?'row-completed':''} ${isOverdue?'row-overdue':''}" style="cursor:pointer" onclick='openDetail("${item.id}",event)'>
      <td><strong>${esc(item.title)}</strong>${recLabel}</td>
      <td><span class="due-date">${displayDate(item.date)}${item.time?' '+fmtTime(item.time):''}</span></td>
      <td>${getClassPillHtml(item.cls)}</td>
      <td><span class="type-badge">${esc(item.type)}</span></td>
      <td>${scoreBadge || '<span style="color:var(--text2)">—</span>'}</td>
      <td>${getStatusShortcutBtnHtml(item)}</td>
      <td>${daysLabel(du)}</td>
    </tr>`;
  }).join('');
  
  return `<div class="list-view">
    <table class="list-table">
      <thead><tr>
        <th>Title</th><th>Due Date</th><th>Class / Category</th><th>Type</th><th>Letter Grade</th><th>Status (Click to cycle)</th><th>Days Until Due</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

// CLASS GROUPED VIEW
function renderByClass() {
  const filtered = applyFilters(items).sort((a,b) => {
    if (!a.date && !b.date) return 0;
    if (!a.date) return 1;
    if (!b.date) return -1;
    return a.date.localeCompare(b.date);
  });

  const groups = {};
  CLASS_DEFINITIONS.forEach(c => { groups[c.name] = []; });
  
  filtered.forEach(i => {
    const k = i.cls || 'General School / Administrative';
    if (!groups[k]) groups[k] = [];
    groups[k].push(i);
  });

  let html = '<div class="list-view" style="display:flex;flex-direction:column;gap:24px;">';
  let hasAny = false;

  for (const [cls, list] of Object.entries(groups)) {
    if (list.length === 0) continue;
    hasAny = true;

    const rows = list.map(item => {
      const du = daysUntil(item.date);
      const done = item.status === 'Completed';
      const recLabel = item.recurring && item.recurring !== 'none' ? ` <span style="font-size:12px;color:var(--text2)">🔄 ${item.recurring}</span>` : '';
      const scoreBadge = getScoreBadgeHtml(item);
      
      return `<tr class="${done?'row-completed':''}" style="cursor:pointer" onclick='openDetail("${item.id}",event)'>
        <td><strong>${esc(item.title)}</strong>${recLabel}</td>
        <td>${displayDate(item.date)}</td>
        <td><span class="type-badge">${esc(item.type)}</span></td>
        <td>${scoreBadge || '<span style="color:var(--text2)">—</span>'}</td>
        <td>${getStatusShortcutBtnHtml(item)}</td>
        <td>${daysLabel(du)}</td>
      </tr>`;
    }).join('');

    html += `<div>
      <div style="font-weight:700;font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px;">
        ${getClassPillHtml(cls)} <span style="font-weight:400;font-size:13px;color:var(--text2)">(${list.length} items)</span>
      </div>
      <table class="list-table"><thead><tr>
        <th>Title</th><th>Due Date</th><th>Type</th><th>Letter Grade</th><th>Status</th><th>Days Until Due</th>
      </tr></thead><tbody>${rows}</tbody></table>
    </div>`;
  }

  if (!hasAny) {
    return `<div class="list-view"><div class="empty-state"><div class="es-icon">📖</div><p>No assignments found for the selected filter.</p></div></div>`;
  }

  html += '</div>';
  return html;
}

// CONVERTER VIEW

    <div class="calc-card">
      <h2 style="font-size: 1.3rem; font-weight: 700; color: #fff; border-bottom: 1px solid var(--border); padding-bottom: 10px;">Grade Letter Converter</h2>
      
      <div class="form-group">
        <label for="standaloneType">System Scale</label>
        <select class="form-input" id="standaloneType" onchange="runStandaloneConverter()">

      <div style="text-align: center; margin-top: 10px;">

function runStandaloneConverter() {
  const type = document.getElementById("standaloneType").value;
  const score = parseFloat(document.getElementById("standaloneScore").value);
  const display = document.getElementById("standaloneDisplay");

  const letter = getLetterGrade(score, type);
  display.innerText = letter;
  display.className = `calc-badge ${getGradeClass(letter)}`;
}

function clearAllData() {
  if (confirm('Are you sure you want to reset all planner data? This cannot be undone.')) {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(SETTINGS_KEY);

    items = [];

    userSettings = {
      highContrast: false,
      largeText: false,
      reducedMotion: false,
      autoZeroOverdue: true
    };

    applySettings();

    if (window.firebasePlannerSync) {
      window.firebasePlannerSync.clearCloudData().catch(error => {
        console.error('Could not clear cloud data:', error);
      });
    }

    render();
  }
}
// MODAL MANAGERS
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function openAddModal(dateStr) {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Add Item';
  document.getElementById('deleteBtn').style.display = 'none';
  document.getElementById('f-title').value = '';
  document.getElementById('f-date').value = dateStr || '';
  document.getElementById('f-time').value = '';
  
  const defaultClass = getAutoClassForDate(dateStr || today()) || CLASS_DEFINITIONS[0].name;
  document.getElementById('f-class').value = defaultClass;

  document.getElementById('f-type').value = 'Class Work';
  document.getElementById('f-status').value = 'Not Started';
  document.getElementById('f-recurring').value = 'none';
  document.getElementById('f-scoreType').value = 'none';
  document.getElementById('f-scoreValue').value = '';
  handleScoreTypeChange();
  document.getElementById('f-notes').value = '';
  document.getElementById('f-link').value = '';
  openModal('addModal');
  setTimeout(() => document.getElementById('f-title').focus(), 100);
}

function openEditModal(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Edit Item';
  document.getElementById('deleteBtn').style.display = 'inline-flex';
  document.getElementById('f-title').value = item.title || '';
  document.getElementById('f-date').value = item.date || '';
  document.getElementById('f-time').value = item.time || '';
  document.getElementById('f-class').value = item.cls || CLASS_DEFINITIONS[0].name;
  document.getElementById('f-type').value = item.type || 'Class Work';
  document.getElementById('f-status').value = item.status || 'Not Started';
  document.getElementById('f-recurring').value = item.recurring || 'none';
  document.getElementById('f-scoreType').value = item.scoreType || 'none';
  document.getElementById('f-scoreValue').value = item.scoreValue !== undefined ? item.scoreValue : '';
  handleScoreTypeChange();
  document.getElementById('f-notes').value = item.notes || '';
  document.getElementById('f-link').value = item.link || '';
  closeModal('dayModal');
  openModal('addModal');
  setTimeout(() => document.getElementById('f-title').focus(), 100);
}

function saveItem() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { document.getElementById('f-title').focus(); return; }
  
  const startDateStr = document.getElementById('f-date').value || null;
  const recurring = document.getElementById('f-recurring').value;
  const recurringGroupId = editingId ? (items.find(i => i.id === editingId)?.recurringGroupId || genId()) : genId();

  const baseData = {
    title,
    time: document.getElementById('f-time').value,
    cls: document.getElementById('f-class').value,
    type: document.getElementById('f-type').value,
    status: document.getElementById('f-status').value,
    recurring: recurring,
    scoreType: document.getElementById('f-scoreType').value,
    scoreValue: document.getElementById('f-scoreValue').value,
    notes: document.getElementById('f-notes').value.trim(),
    link: document.getElementById('f-link').value.trim(),
    recurringGroupId: recurring !== 'none' ? recurringGroupId : null
  };

  if (editingId) {
    const existingIndex = items.findIndex(i => i.id === editingId);
    const existingItem = items[existingIndex];
    
    if (existingItem.recurringGroupId) {
      items = items.filter(i => i.recurringGroupId !== existingItem.recurringGroupId || i.id === editingId);
    }

    items[existingIndex] = { ...baseData, id: editingId, date: startDateStr };
  } else {
    items.push({ ...baseData, id: genId(), date: startDateStr });
  }

  if (recurring !== 'none' && startDateStr) {
    let currDate = parseLocalDate(startDateStr);
    const targetYear = currDate.getFullYear() > 2026 ? currDate.getFullYear() : 2027;
    const endDate = new Date(targetYear, 5, 7); 

    while (true) {
      if (recurring === 'daily') currDate = addDays(currDate, 1);
      else if (recurring === 'weekly') currDate = addDays(currDate, 7);
      else if (recurring === 'biweekly') currDate = addDays(currDate, 14);
      else if (recurring === 'monthly') currDate = addMonths(currDate, 1);

      if (currDate > endDate) break;

      items.push({ ...baseData, id: genId(), date: fmtDate(currDate) });
    }
  }

  save();
  closeModal('addModal');
  render();
}

function deleteItem() {
  if (!editingId) return;
  const item = items.find(i => i.id === editingId);
  if (!item) return;

  if (item.recurringGroupId) {
    const choice = confirm('Delete all recurring instances of this item?\nPress OK to delete all, or Cancel to delete only this single instance.');
    if (choice) {
      items = items.filter(i => i.recurringGroupId !== item.recurringGroupId);
    } else {
      items = items.filter(i => i.id !== editingId);
    }
  } else {
    if (!confirm('Delete this item?')) return;
    items = items.filter(i => i.id !== editingId);
  }

  save();
  closeModal('addModal');
  render();
}

function openDayModal(dateStr, e) {
  e.stopPropagation();
  const dayItems = applyFilters(items).filter(i => i.date === dateStr).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const d = parseLocalDate(dateStr);
  const label = d.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'});
  document.getElementById('dayModalTitle').textContent = label;
  const body = document.getElementById('dayModalBody');
  
  if (dayItems.length === 0) {
    body.innerHTML = '<div class="empty-state" style="padding:30px 0"><div class="es-icon">📭</div><p>No items on this day.</p></div>';
  } else {
    body.innerHTML = `<div class="day-event-list">${dayItems.map(item => `
      <div class="day-event-card ${item.status==='Completed'?'completed':''}" onclick='openDetail("${item.id}",event)'>
        <div class="day-event-title">
          <span>${esc(item.title)}${item.recurring && item.recurring !== 'none' ? ' 🔄' : ''}</span>
          ${getStatusShortcutBtnHtml(item)}
        </div>
        <div class="day-event-meta">
          ${getClassPillHtml(item.cls)}
          <span class="type-badge">${esc(item.type)}</span>
          ${getScoreBadgeHtml(item)}${item.time?`<span>🕐 ${fmtTime(item.time)}</span>`:''}
        </div>
      </div>`).join('')}</div>`;
  }
  document.getElementById('dayModalAddBtn').onclick = () => { closeModal('dayModal'); openAddModal(dateStr); };
  openModal('dayModal');
}

function openDetail(id, e) {
  e.stopPropagation();
  openEditModal(id);
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const hr = h % 12 || 12;
  return `${hr}:${String(m).padStart(2,'0')} ${ampm}`;
}

// Modal Click/Key handlers
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open'));
});

// INITIALIZE
render();
</script>
